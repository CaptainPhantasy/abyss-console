       <style id="abyss-skin">/* The whale picture runs edge to edge behind everything; nothing sits in an opaque box.
   The build script appends .abyss-art{background-image:url(data:image/webp;base64,...)} below. */

html.abyss-art,
body.abyss-art {
  background-color: #04080f;
  background-position: center center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  min-height: 100%;
}

/* A soft wash so the rail and the headline keep their contrast over a busy picture. */
body.abyss-art::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    linear-gradient(90deg, rgba(3, 7, 13, 0.74) 0%, rgba(3, 7, 13, 0.44) 34%, rgba(3, 7, 13, 0.08) 64%, rgba(3, 7, 13, 0.36) 100%),
    radial-gradient(1100px 620px at 10% -6%, rgba(3, 7, 13, 0.6), rgba(3, 7, 13, 0) 68%);
}

#root {
  position: relative;
  z-index: 1;
}

    '- title: 6 words or fewer, concrete, no "AI-powered", no "revolutionary".',
    "- pitch: one or two plain sentences: what it does and who pays for it.",
    "- roi_math: the arithmetic with the real numbers above. If you cannot show the arithmetic, choose a different idea.",
    "- build_steps: 4 to 8 ordered steps, each a concrete action.",
    "- model_plan: which model, thinking on or off, and why.",
    "- cache_trick: how this design keeps a byte-identical prefix and farms the $0.003 hit price.",
    "- novelty_key: 2 to 4 kebab-case words a later run can dedupe on.",
    "- lever: exactly one of " + LEVERS.join(", ") + ".",
    "- unit.input_tokens_per_job and unit.output_tokens_per_job: positive integers for ONE unit of delivered work.",
    "- unit.cache_hit_ratio: a number from 0 to 1 — the fraction of input tokens billed at the hit price.",
    "- unit.cost_per_job_usd_offpeak: must equal (input*(1-hit)*0.15 + input*hit*0.003 + output*0.60)/1000000 using deepseek-flash prices. It is checked by code; a wrong number rejects the whole json.",
    "- unit.price_to_customer_usd: a number greater than that cost.",
    '- unit.gross_margin: whole-percent string such as "94%", equal to (price - cost) / price.',
    "",
    "QUALITY BAR",
    "Reject your own idea and pick another if someone who has never read the DeepSeek pricing page could have written it.",
  ].join("\n");

  function buildUserPrompt({ excludeLines, dateStr, locale }) {
    return [
      "Generate today's Daily ROI as one json object, per the contract in the system message. Nothing else.",
      "",
      "EXCLUDE — never repeat, paraphrase, or lightly reskin these; oldest first:",
      excludeLines && excludeLines.length ? excludeLines.join("\n") : "(none yet — this is the first run)",
      "",
      "today: " + dateStr,
      "locale: " + locale,
      "novelty_key must not collide with any key above.",
      "Output the json object now.",
    ].join("\n");
  }

  function repairPrompt(errors) {
    return [
      "Your previous json was rejected by mechanical validation:",
      ...errors.slice(0, 6).map((e) => "- " + e),
      "",
      "Fix exactly those problems and return the corrected json object. Same contract, nothing else.",
    ].join("\n");
  }

  /* Read whatever came back. Fences stripped, braces balanced, and an empty or
     cut-off answer named as such instead of "broken JSON". */
  function parseIdea(raw, finishReason) {
    if (typeof raw !== "string" || raw.trim() === "") {
      return { ok: false, error: "the answer came back empty (finish_reason=" + (finishReason || "?") + ")" };
    }
    const t = raw.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
    const start = t.indexOf("{");
    if (start < 0) return { ok: false, error: "no json object in the answer" };
    let depth = 0,
      end = -1,
      inStr = false,
      esc = false;
    for (let i = start; i < t.length; i++) {
      const c = t.charAt(i);
      if (inStr) {
        if (esc) esc = false;
        else if (c === "\\") esc = true;
        else if (c === '"') inStr = false;
        continue;
      }
      if (c === '"') inStr = true;
      else if (c === "{") depth++;
      else if (c === "}") {
        depth--;
        if (depth === 0) {
          end = i;
          break;
        }
      }
    }
    if (end < 0) {
      return {
        ok: false,
        error:
          "the json was cut off before its closing brace (finish_reason=" +
          (finishReason || "?") +
          ")" +
          (finishReason === "length" ? " — the answer allowance ran out" : ""),
      };
    }
    try {
      return { ok: true, value: JSON.parse(t.slice(start, end + 1)) };
    } catch (e) {
      return { ok: false, error: "the json would not parse: " + e.message };
    }
  }

  const isObj = (o) => o && typeof o === "object" && !Array.isArray(o);
  const isNear = (a, b, slack) => Math.abs(a - b) <= Math.max(1e-9, slack);

  function validateIdea(obj, { usedKeys = [], prices } = {}) {
    const e = [];
    if (!isObj(obj)) return ["the answer is not a json object"];
    const flash = (prices && prices["deepseek-flash"]) || { miss: 0.15, hit: 0.003, out: 0.6 };

    ["title", "pitch", "roi_math", "build_steps", "model_plan", "cache_trick", "novelty_key", "lever", "unit"].forEach((k) => {
      if (!(k in obj)) e.push("missing field: " + k);
    });
    if (typeof obj.title !== "string" || obj.title.trim().split(/\s+/).length > 6)
      e.push("title must be a short string of 6 words or fewer");
    if (typeof obj.pitch !== "string" || obj.pitch.length < 40) e.push("pitch must be one or two full sentences");
    if (typeof obj.roi_math !== "string" || obj.roi_math.length < 40) e.push("roi_math must show the arithmetic");
    if (typeof obj.cache_trick !== "string" || obj.cache_trick.length < 15) e.push("cache_trick is too short");
    if (typeof obj.model_plan !== "string" || obj.model_plan.length < 10) e.push("model_plan is too short");
    if (!Array.isArray(obj.build_steps) || obj.build_steps.length < 4 || obj.build_steps.length > 8)
      e.push("build_steps must be an array of 4 to 8 steps");
    if (LEVERS.indexOf(obj.lever) === -1) e.push("lever must be exactly one of: " + LEVERS.join(", "));

    if (typeof obj.novelty_key !== "string" || !/^[a-z0-9]+(-[a-z0-9]+){1,3}$/.test(obj.novelty_key)) {
      e.push("novelty_key must be 2 to 4 kebab-case words, for example cache-sitter");
    } else if (usedKeys.indexOf(obj.novelty_key) !== -1) {
      e.push('novelty_key "' + obj.novelty_key + '" was already used on a previous day; pick a different idea');
    }

    const u = obj.unit;
    if (!isObj(u)) {
      e.push("unit must be an object with the cost arithmetic");
      return e;
    }
    const inTok = u.input_tokens_per_job,
      outTok = u.output_tokens_per_job,
      hit = u.cache_hit_ratio;
    if (!Number.isInteger(inTok) || inTok <= 0) e.push("unit.input_tokens_per_job must be a positive whole number");
    if (!Number.isInteger(outTok) || outTok <= 0) e.push("unit.output_tokens_per_job must be a positive whole number");
    if (typeof hit !== "number" || hit < 0 || hit > 1) e.push("unit.cache_hit_ratio must be a number from 0 to 1");
    if (
      e.some(
        (x) =>
          x.startsWith("unit.input_tokens_per_job") ||
          x.startsWith("unit.output_tokens_per_job") ||
          x.startsWith("unit.cache_hit_ratio"),
      )
    )
      return e;

    const expected = (inTok * (1 - hit) * flash.miss + inTok * hit * flash.hit + outTok * flash.out) / 1e6;
    const claimed = u.cost_per_job_usd_offpeak;
    if (typeof claimed !== "number") {
      e.push("unit.cost_per_job_usd_offpeak must be a number");
    } else if (!isNear(claimed, expected, 0.05 * expected)) {
      e.push(
        "unit.cost_per_job_usd_offpeak is " +
          claimed +
          "; the arithmetic gives " +
          expected.toFixed(8) +
          " for " +
          inTok +
          " input at " +
          Math.round(hit * 100) +
          "% cache hit plus " +
          outTok +
          " output on deepseek-flash off-peak ($0.15 miss / $0.003 hit / $0.60 out per 1M)",
      );
    }

    const price = u.price_to_customer_usd;
    if (typeof price !== "number" || price <= expected) {
      e.push("unit.price_to_customer_usd must be a number greater than the " + expected.toFixed(8) + " cost");
    }
    const gm = u.gross_margin;
    if (typeof gm !== "string" || !/^\d{1,3}%$/.test(gm)) {
      e.push('unit.gross_margin must be a whole-percent string such as "94%"');
    } else if (typeof price === "number" && price > 0) {
      const want = ((price - expected) / price) * 100;
      if (Math.abs(parseInt(gm, 10) - want) > 5)
        e.push("unit.gross_margin " + gm + " disagrees with the price and cost; it should be about " + want.toFixed(0) + "%");
    }
    return e;
  }

  /* Which models to try, in order. Pro only while the live list still offers it. */
  function resolveAttempts(modelIds) {
    const ids = Array.isArray(modelIds) ? modelIds : [];
    const hasPro = ids.length === 0 ? true : ids.indexOf("deepseek-v4-pro") !== -1;
    const first = { model: "deepseek-flash", temperature: 1.25, maxTokens: 4000, thinking: false, note: "flash, first pass" };
    const second = { ...first, temperature: 0.4, note: "flash retry, problems quoted back" };
    const third = hasPro
      ? { model: "deepseek-v4-pro", temperature: 0.9, maxTokens: 6000, thinking: false, note: "escalated to v4-pro" }
      : { model: "deepseek-flash", temperature: 0.8, maxTokens: 6000, thinking: true, effort: "high", note: "flash again, thinking on" };
    return [first, second, third];
  }

  function createRoiEngine(deps) {
    const { callApi, recordUsage, cheatsheet, today, locale, prices, modelIds } = deps;

    async function generate() {
      const dateStr = today();
      const messages = [
        { role: "system", content: cheatsheet + "\n\n" + SYSTEM_CONTRACT },
        { role: "user", content: buildUserPrompt({ excludeLines: deps.excludeLines(), dateStr, locale }) },
      ];
      const usedKeys = deps.usedKeys ? deps.usedKeys() : [];
      const attempts = resolveAttempts(modelIds);
      const log = [];
      let spent = 0;
      let raw = "";

      for (let i = 0; i < attempts.length; i++) {
        const a = attempts[i];
        if (deps.onStatus) deps.onStatus("attempt " + (i + 1) + " of 3 — " + a.note + "…");
        let r;
        try {
          r = await callApi({
            model: a.model,
            messages,
            thinking: a.thinking,
            effort: a.effort,
            temperature: a.temperature,
            maxTokens: a.maxTokens,
            json: true,
            onDelta: () => {},
          });
        } catch (err) {
          const msg = String((err && err.message) || err);
          log.push({ note: a.note, model: a.model, transportError: msg });
          messages.push({
            role: "user",
            content: "The previous attempt failed in transport: " + msg + "\nReturn the same json object again.",
          });
          continue;
        }
        const usage = await recordUsage(a.model, r.usage);
        spent += (usage && usage.cost) || 0;
        raw = r.content || "";

        const parsed = parseIdea(raw, r.finishReason);
        const errs = parsed.ok ? validateIdea(parsed.value, { usedKeys, prices }) : [parsed.error];
        log.push({ note: a.note, model: a.model, finish: r.finishReason, usage: r.usage, errors: errs.length ? errs : null, raw });

        if (parsed.ok && errs.length === 0) return { ok: true, idea: parsed.value, attempts: log, cost: spent };
        messages.push({ role: "assistant", content: raw });
        messages.push({ role: "user", content: repairPrompt(errs) });
      }
      return { ok: false, error: "all 3 attempts failed — the last answer is shown below", attempts: log, cost: spent, raw };
    }

    return { generate };
  }

  globalThis.AbyRoi = {
    LEVERS,
    SYSTEM_CONTRACT,
    buildUserPrompt,
    repairPrompt,
    parseIdea,
    validateIdea,
    resolveAttempts,
    createRoiEngine,
  };
})();
</script>
    <script type="module" id="abyss-redact">/* ============================================================================
   Secret scrubber — everything that leaves the machine passes through here first.
   The page reads it as globalThis.AbyRedact; the tests read it straight out of
   the built page, so what ships is what is checked.
   ========================================================================== */
(() => {
  "use strict";

  const RULES = [
    { name: "deepseek-style key", re: /\bsk-[A-Za-z0-9_-]{16,}/g, swap: "sk-REDACTED" },
    { name: "aws access key", re: /\bAKIA[0-9A-Z]{16}\b/g, swap: "AKIA-REDACTED" },
    { name: "github token", re: /\bgh[pousr]_[A-Za-z0-9]{20,}\b/g, swap: "ghx-REDACTED" },
    { name: "slack token", re: /\bxox[baprs]-[A-Za-z0-9-]{10,}\b/g, swap: "xoxb-REDACTED" },
    { name: "google api key", re: /\bAIza[0-9A-Za-z_-]{30,}\b/g, swap: "AIza-REDACTED" },
    {
      name: "private key block",
      re: /-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----/g,
      swap: "-----BEGIN PRIVATE KEY-----REDACTED-----END PRIVATE KEY-----",
    },
    {
      name: "named secret",
      re: /\b(api[_-]?key|secret|password|passwd|token|authorization|bearer)\b(\s*[:=]\s*|\s+)["']?([A-Za-z0-9_\-./+=]{12,})/gi,
      swap: (_m, label, sep) => label + (sep || ": ") + "REDACTED",
    },
    {
      name: "connection string password",
      re: /\b([a-z]+:\/\/[^\s:@/]+):([^\s:@/]{6,})@/gi,
      swap: (_m, head) => head + ":REDACTED@",
    },
  ];

  /* Returns the text with every secret replaced, and a list of what was caught
     (kind and a masked sample only — never the secret itself). */
  function redact(text) {
    let out = String(text == null ? "" : text);
    const found = [];
    for (const rule of RULES) {
      out = out.replace(rule.re, (...args) => {
        const match = args[0];
        const masked = match.length <= 8 ? "…" : match.slice(0, 4) + "…" + match.slice(-2);
        found.push({ kind: rule.name, sample: masked, length: match.length });
        return typeof rule.swap === "function" ? rule.swap(...args) : rule.swap;
      });
    }
    return { text: out, found, count: found.length };
  }

  /* A short line for the screen: "2 secrets redacted (deepseek-style key, named secret)". */
  function summary(found) {
    if (!found || !found.length) return "";
    const kinds = [...new Set(found.map((f) => f.kind))];
    return (
      found.length +
      (found.length === 1 ? " secret" : " secrets") +
      " redacted before sending (" +
      kinds.join(", ") +
      ")"
    );
  }

  globalThis.AbyRedact = { RULES, redact, summary };
})();
</script>
    <script type="module" id="dc-mcp-engine">
    /* ================================================================
       Desktop Commander MCP engine — permission gates + MCP client.
       Executes before the app bundle; the app reads globalThis.DCEngine.
       Single source of truth for gating; E2E-tested in
       tests/dc-gate.e2e.mjs against a mock Streamable-HTTP MCP server.
       ================================================================ */
    (() => {
      "use strict";

      /* ---- Risk taxonomy --------------------------------------------
         Fail-safe rule: a tool must be PROVABLY read-only to auto-run.
         Unknown names are always treated as risky.                    */
      const SAFE = new Set(["read_file","read_text_file","read_multiple_text_files","list_directory","directory_tree","search_files","search_code","list_processes","get_command_status","read_output","get_config","get_interaction_settings","list_allowed_directories","info","file_info","list_sessions","list_code_definition_names","search_config"]);
      const RISKY = new Set(["write_file","write_text_file","edit_block","edit_file","create_directory","move_file","delete_file","delete_directory","start_process","execute_command","run_command","force_terminate","kill_process","send_keystrokes","open_native_app","set_config_value","set_interaction_settings","download_file","create_session","reset_session","close_session"]);
      const RISKY_VERB = /^(write|edit|create|delete|remove|move|copy|rename|kill|terminate|execute|run|start|send|set|put|post|patch|install|uninstall|download|open|reset|clear|flush|drop|truncate)/i;

      function classifyRisk(name) {
        const n = String(name || "");
        if (SAFE.has(n) && !RISKY.has(n)) return "safe";
        if (RISKY.has(n) || RISKY_VERB.test(n)) return "risky";
        return "unknown"; /* == risky wherever it matters */
      }

      const GATES = ["PLAN", "ASK ALWAYS", "ASK WHEN NEEDED", "YOLO"];

      function decide(mode, toolName) {
        const risk = classifyRisk(toolName);
        switch (mode) {
          case "PLAN":            return { exec: "block", risk, reason: "PLAN mode: tool execution disabled (planning only)" };
          case "ASK ALWAYS":      return { exec: "ask",   risk, reason: "ASK ALWAYS: every tool call needs explicit approval" };
          case "ASK WHEN NEEDED": return risk === "safe"
                                    ? { exec: "auto", risk, reason: "read-only tool" }
                                    : { exec: "ask",  risk, reason: "risky/damaging or unknown tool" };
          case "YOLO":            return { exec: "auto",  risk, reason: "YOLO: no approval prompts" };
          default:                return { exec: "block", risk, reason: "unknown gate (fail-safe)" };
        }
      }

      /* ---- MCP client: Streamable HTTP primary, legacy SSE fallback -- */
      const PROTO = "2025-06-18";
      let seq = 0;

      function tsignal(ms, external) {
        const ac = new AbortController();
        const t = setTimeout(() => { try { ac.abort(new Error("MCP timeout after " + ms + "ms")); } catch {} }, ms);
        const onAbort = () => { clearTimeout(t); try { ac.abort(external && external.reason); } catch {} };
        if (external) { if (external.aborted) onAbort(); else external.addEventListener("abort", onAbort, { once: true }); }
        return { signal: ac.signal, done: () => { clearTimeout(t); if (external) external.removeEventListener("abort", onAbort); } };
      }

      async function readBody(res) {
        const ct = (res.headers.get("content-type") || "").toLowerCase();
        if (ct.includes("text/event-stream")) {
          const reader = res.body.getReader(), dec = new TextDecoder();
          let buf = "", hit = null;
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const parts = buf.split(/\r?\n/); buf = parts.pop();
            for (const line of parts) {
              if (!line.startsWith("data:")) continue;
              const p = line.slice(5).trim();
              if (!p || p === "[DONE]") continue;
              try { const j = JSON.parse(p); if (j && typeof j.id === "number") hit = j; } catch {}
            }
          }
          return hit;
        }
        const text = await res.text(); /* text first — error bodies are not always JSON */
        try { return JSON.parse(text); } catch { throw new Error("MCP bad response (HTTP " + res.status + "): " + text.slice(0, 200)); }
      }

      class McpSession {
        constructor(url) { this.url = String(url || "").replace(/\/+$/, ""); this.sessionId = null; this.tools = []; this.status = "idle"; this.lastError = null; this.transport = null; this._sse = null; }
        async rpc(method, params, ms = 30000, ext) {
          const body = { jsonrpc: "2.0", id: ++seq, method, ...(params ? { params } : {}) };
          const { signal, done } = tsignal(ms, ext);
          try {
            const headers = { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" };
            if (this.sessionId) headers["Mcp-Session-Id"] = this.sessionId;
            const res = await fetch(this.url + "/mcp", { method: "POST", headers, body: JSON.stringify(body), signal });
            const sid = res.headers.get("mcp-session-id"); if (sid) this.sessionId = sid;
            if (!res.ok) { const t = await res.text().catch(() => ""); throw new Error("MCP HTTP " + res.status + (t ? " — " + t.slice(0, 200) : "")); }
            return await readBody(res);
          } finally { done(); }
        }
        async notify(method) {
          const headers = { "Content-Type": "application/json" };
          if (this.sessionId) headers["Mcp-Session-Id"] = this.sessionId;
          const res = await fetch(this.url + "/mcp", { method: "POST", headers, body: JSON.stringify({ jsonrpc: "2.0", method }) });
          if (!res.ok) throw new Error("MCP notify HTTP " + res.status);
        }
        async _sseConnect() {
          const base = this.url;
          const res = await fetch(base + "/sse", { headers: { Accept: "text/event-stream" } });
          if (!res.ok) throw new Error("legacy SSE connect failed: HTTP " + res.status);
          const reader = res.body.getReader(), dec = new TextDecoder();
          this._sse = { reader, endpoint: null, pending: new Map(), onEndpoint: null };
          (async () => {
            let buf = "";
            try {
              for (;;) {
                const { done, value } = await reader.read(); if (done) break;
                buf += dec.decode(value, { stream: true });
                const lines = buf.split(/\r?\n/); buf = lines.pop();
                let ev = "";
                for (const line of lines) {
                  if (line.startsWith("event:")) ev = line.slice(6).trim();
                  else if (line.startsWith("data:")) {
                    const d = line.slice(5).trim(); 
                    if (ev === "endpoint" || (ev === "" && d.startsWith("/"))) { this._sse.endpoint = new URL(d, base).toString(); if (this._sse.onEndpoint) this._sse.onEndpoint(); }
                    else { try { const j = JSON.parse(d); if (j && typeof j.id === "number" && this._sse.pending.has(j.id)) { this._sse.pending.get(j.id)(j); this._sse.pending.delete(j.id); } } catch {} }
                    ev = "";
                  }
                }
              }
            } catch {}
          })();
          await new Promise((ok, bad) => { this._sse.onEndpoint = ok; setTimeout(() => bad(new Error("SSE endpoint event timeout")), 10000); });
          this.transport = "sse";
        }
        async _sseRpc(method, params, ms = 30000) {
          const id = ++seq;
          const body = { jsonrpc: "2.0", id, method, ...(params ? { params } : {}) };
          const p = new Promise((ok, bad) => { this._sse.pending.set(id, ok); setTimeout(() => { if (this._sse.pending.delete(id)) bad(new Error("SSE rpc timeout")); }, ms); });
          const res = await fetch(this._sse.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
          if (!res.ok) throw new Error("SSE POST failed: HTTP " + res.status);
          return await p;
        }
        async call(method, params, ms, ext) { return this.transport === "sse" ? this._sseRpc(method, params, ms) : this.rpc(method, params, ms, ext); }
        async connect() {
          this.status = "connecting"; this.lastError = null; emit();
          try {
            try {
              await this.rpc("initialize", { protocolVersion: PROTO, capabilities: {}, clientInfo: { name: "deepseek-api-console", version: "1.1" } });
              this.transport = "streamable-http";
              await this.notify("notifications/initialized").catch(() => {});
            } catch (e) {
              if (!/HTTP 4\d\d|Failed to fetch|fetch failed|Load failed|NetworkError/i.test(String(e.message))) throw e;
              await this._sseConnect();
              await this._sseRpc("initialize", { protocolVersion: PROTO, capabilities: {}, clientInfo: { name: "deepseek-api-console", version: "1.1" } });
              await this._sseRpc("notifications/initialized").catch(() => {});
            }
            const listed = await this.call("tools/list", {});
            this.tools = (listed && listed.result && listed.result.tools) || [];
            if (!this.tools.length) throw new Error("server listed zero tools");
            this.status = "ready"; emit(); return this.snapshot();
          } catch (e) { this.status = "error"; this.lastError = String(e.message || e); this.lastReason = reasonFor(this.lastError, await quickReachable(this.url), this.url, false); emit(); throw e; }
        }
        toolNames() { return new Set(this.tools.map(t => t.name)); }
        openAiTools() { return this.tools.map(t => ({ type: "function", function: { name: t.name, description: t.description || "", parameters: t.inputSchema || t.parameters || { type: "object", properties: {} } } })); }
        async callTool(name, args, ext) {
          if (this.status !== "ready") throw new Error("MCP not connected (status " + this.status + ")");
          if (!this.toolNames().has(name)) throw new Error('tool "' + name + '" was not in tools/list — refusing');
          const r = await this.call("tools/call", { name, arguments: args ?? {} }, 180000, ext);
          const out = r && r.result;
          if (!out) throw new Error((r && r.error && r.error.message) || "empty tools/call response");
          if (out.isError) throw new Error("tool error: " + textOf(out));
          return textOf(out);
        }
        snapshot() { return { status: this.status, url: this.url, transport: this.transport, sessionId: this.sessionId, tools: this.tools.map(t => ({ name: t.name, risk: classifyRisk(t.name) })), lastError: this.lastError, lastReason: this.lastReason || null }; }
      }

      /* ---- WebSocket MCP transport (GEMINI bridge, port 13001) ------ */
      class WsSession {
        constructor(url, token) {
          this.httpUrl = String(url || "").replace(/\/+$/, "");

      /* ---- Phased diagnostics (never fail silently again) ----------- */
      async function probe(url, token) {

1) Static content FIRST (system prompt, docs, few-shot, tool schemas), variable content LAST. One changed early byte kills the match.

3) Multi-turn: resend history verbatim + append; each turn's transcript is the next turn's cached prefix.

5) The cache makes "stuff the 1M context" often cheaper than building a RAG pipeline.

## 5. Thinking mode (reasoning)

## 6. Streaming (SSE)
- "stream": true => data: {json} chunks ending data: [DONE]. reasoning_content deltas stream FIRST, then content deltas.
- Add stream_options {"include_usage": true} or every chunk shows usage null. The final usage chunk may have an EMPTY choices array — guard it.
- Long Pro/max generations run minutes; proxies/CDNs kill idle SSE — raise timeouts on every hop. Slow is not dead.

## 8. Routing brain (cheapest correct answer wins)

- flash + thinking high: everyday coding, debugging, agents — the price/quality sweet spot of 2026.

function ideaUnitCost(unit) {
  const f = PRICES["deepseek-flash"];
  const inTok = unit.input_tokens_per_job,
    outTok = unit.output_tokens_per_job,
    hit = unit.cache_hit_ratio;
  return (inTok * (1 - hit) * f.miss + inTok * hit * f.hit + outTok * f.out) / 1e6;
}

/* The numbers the idea claims, recomputed here from the price table, so a wrong
   count is visible at a glance instead of taken on trust. */
function IdeaUnitTable({ unit }) {
  const expected = ideaUnitCost(unit);

    ["Input tokens per job", Number(unit.input_tokens_per_job).toLocaleString()],
    ["Cache-hit ratio", Math.round(unit.cache_hit_ratio * 100) + "% at $0.003/M"],

/* A reply that says "### file: <path>" and then a fenced block is proposing a write.
   Everything here is a proposal until the button is pressed. */
function fileBlocks(text) {
  const out = [];
  const re = /(?:^|\n)#{2,4}\s*file:\s*([^\n`]+)\n+```[a-zA-Z0-9_-]*\n([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(String(text || "")))) out.push({ path: m[1].trim(), code: m[2] });
  return out;
}

/* A reply can also carry a unified diff. Those get their own card, applied hunk by hunk
   after the helper has checked each hunk against the file as it is right now. */
function findPatch(text) {
  const src = String(text || "");
  const fence = src.match(/```(?:diff|patch)?\n([\s\S]*?)```/);
  const body = fence ? fence[1] : src;
  if (!/^---\s+\S+/m.test(body) || !/^\+\+\+\s+\S+/m.test(body) || !/^@@/m.test(body)) return null;
  const files = [];
  let cur = null;
  for (const line of body.split("\n")) {
    const m = line.match(/^\+\+\+\s+(?:b\/)?(.+?)\s*$/);
    if (m) {
      cur = { path: m[1], hunks: 0, added: 0, removed: 0 };
      files.push(cur);
      continue;
    }
    if (!cur) continue;
    if (/^@@/.test(line)) cur.hunks++;
    else if (/^\+/.test(line) && !/^\+\+\+/.test(line)) cur.added++;
    else if (/^-/.test(line) && !/^---/.test(line)) cur.removed++;
  }
  return files.length ? { patch: body, files } : null;
}

      const afterSet = new Set(afterLines);

      const removed = beforeLines.filter((l) => l.trim() && !afterSet.has(l)).length;
